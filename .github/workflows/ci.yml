name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 06:00 UTC to verify against latest environment and package updates
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TLJExplorer.sln

      - name: Build solution
        run: dotnet build TLJExplorer.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test TLJExplorer.sln -c Release --no-build --verbosity normal
